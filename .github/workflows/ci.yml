# Offline tests on every push and pull request. No workspace, no secrets.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt -r deployer/requirements.txt

      - name: Portal tests
        run: |
          set -e
          for t in test_adapters test_builder test_genie test_knowledge test_dashboard test_mcps test_events test_designer test_designer_models test_forge test_tooltest test_attachments test_approvals test_app_agents test_custom_agents test_secure test_designer_guard test_chats test_memory test_agent_export test_code_upload test_code_agent test_sandbox; do
            echo "::group::$t"
            python "$t.py"
            echo "::endgroup::"
          done

      - name: Deployer tests
        run: python deployer/test_deployer.py

      # A release only ships when no package it uses has a known vulnerability (SECURITY.md).
      - name: Python packages have no known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r deployer/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: UI packages have no known vulnerabilities
        working-directory: ui
        run: npm audit --omit=dev --audit-level=low
